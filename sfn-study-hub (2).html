“normal” eating is:","o":["unplanned.","systematic.","flexible.","ritualistic."],"a":2},{"q":"Which of the following characteristics is NOT associated with anorexia athletica?","o":["Voluntary excessive exercise","Weight cycling","Losing body fat to improve performance","Lifelong struggle with abnormal eating patterns"],"a":3},{"q":"In which sport are athletes likely to meet the criteria for anorexia athletica but rarely for anorexia nervosa or bulimia nervosa?","o":["Gymnastics","Wrestling","Ballet","Long-distance running"],"a":1},{"q":"Amenorrhea is associated with:","o":["anorexia nervosa.","bulimia nervosa.","anorexia athletica.","a and c","all of the above"],"a":4},{"q":"Why are wrestlers who restrict food and purge to “make weight” not considered to have an eating disorder not otherwise specified (EDNOS)?","o":["They only behave this way during wrestling season.","They do not base their self-esteem on weight.","They fall within the normal range on tests of eating attitudes.","a and b","All of the above"],"a":4},{"q":"The best definition of excessive exercise is:","o":["exercise equivalent to running more than 50 miles/week.","exercise equivalent to running more than 100 miles/week.","exercise equivalent to running more than 150 miles/week.","none of the above"],"a":3},{"q":"The following episodes are associated with binge eating:","o":["eating much more rapidly than normal","eating until feeling uncomfortably full","Feeling disgusted with oneself, depressed or very guilty afterwards.","All of the above are episodes associated with binge eating"],"a":3},{"q":"Which condition listed below is the most prevalent in athletes?","o":["Anorexia nervosa","Bulimia nervosa","Disordered eating","All of the above have approximately the same prevalence"],"a":2},{"q":"Which of the following is true regarding male athletes and eating disorders?","o":["Eating disorders have only been documented in female athletes.","Eating disorders have been documented in males but only in wrestlers and bodybuilders.","Eating disorders in male athletes have been reported but the prevalence is low.","The prevalence of eating disorders in males appears to be on a rapid rise."],"a":2},{"q":"Which of the following best describes the condition known as muscle dysmorphia?","o":["Excessive protein synthesis in skeletal muscles","Severe psychological distress if not able to exercise","Lack of increase in muscle mass despite appropriate eating and exercise","Preoccupation and dissatisfaction with muscle size"],"a":3},{"q":"What is the expected impact on muscle mass when disordered eating or an eating disorder is present over many years?","o":["Likely to decline","Likely to increase","Not likely to be affected"],"a":0},{"q":"What is the expected impact on bone density when disordered eating or an eating disorder is present over many years?","o":["Likely to decline","Likely to increase","Not likely to be affected"],"a":0},{"q":"What is the expected impact on metabolic rate when disordered eating or an eating disorder is present over many years?","o":["Likely to decline","Likely to increase","Not likely to be affected"],"a":0},{"q":"What is the expected impact on long-term performance when disordered eating or an eating disorder is present over many years?","o":["Likely to decline","Likely to increase","Not likely to be affected"],"a":0},{"q":"If the presence of an eating disorder is suspected, which is the most appropriate course of action for a coach to take?","o":["Give the athlete time to resolve the issue before taking any action.","Ask an assistant coach or athletic trainer to talk directly to the athlete.","Meet with the athlete and casually discuss his or her food intake.","Immediately refer the athlete to a trained professional for further evaluation."],"a":3},{"q":"Why does the International Olympic Committee Medical Commission recommend that coaches not be involved in determining or evaluating an athlete’s weight or body composition?","o":["Coaches always choose a weight that is too low.","Coaches typically have the most influence over an athlete’s behavior.","Coaches do not have the time to closely monitor the athlete’s diet.","Coaches cause eating disorders."],"a":1},{"q":"What are the three distinct but interrelated factors associated with the Female Athlete Triad?","o":["Health, fitness, and longevity","Anorexia nervosa, bulimia nervosa, and anorexia athletica","Appearance, performance, and optimal body weight","Energy availability, menstrual function, and bone mineral density"],"a":3},{"q":"Muscle dysmorphia is more prevalent in females than males.","o":["True","False"],"a":1},{"q":"Low energy availability is defined as a(n):","o":["energy expenditure that routinely exceeds energy intake.","low energy intake caused by an eating disorder.","hormonal disruption that results in the delayed uptake of glucose.","reduced metabolic rate due to self-imposed starvation."],"a":0},{"q":"Amenorrhea is defined as an:","o":["abnormally high concentration of estrogen-related hormones.","absence or suppression of menstruation.","excess production of testosterone in females.","absence of normal testosterone production in males."],"a":1},{"q":"Diagnosing exercise dependence or voluntary excessive exercise is relatively easy because the diagnostic criterion is specific for the maximum amount of exercise that should be performed in a week.","o":["True","False"],"a":1},{"q":"Most wrestlers that use self-induced vomiting and laxatives to “cut” weight also have eating disorders.","o":["True","False"],"a":1},{"q":"Sports considered at high risk for development of disordered eating include bodybuilding, lightweight rowing, and distance running.","o":["True","False"],"a":0},{"q":"Less is known about eating disorders and disordered eating in males than females.","o":["True","False"],"a":0},{"q":"Athletes with and without disordered eating patterns share many features of their diet and exercise patterns but differ in their actions and perspectives.","o":["True","False"],"a":0}],"13":[{"q":"A client who is 50 lb overweight and has high blood pressure is discouraged because she has only lost 10 lb of body fat. What effect would a 10-pound loss of body fat likely have on her blood pressure?","o":["Raise blood pressure","Lower blood pressure","No effect because a 10 lb weight loss is not enough for a person who is 50 lb overweight"],"a":1},{"q":"What is “creeping obesity”?","o":["A slow gain of body fat as adults age","The process of muscle turning to fat","Change in body fat distribution after menopause","A genetic predisposition to gain weight"],"a":0},{"q":"A 30-year-old sedentary male has a body mass index (BMI) of 31. Which category does this place him in?","o":["Low BMI","Healthy range","Overweight","Obesity"],"a":3},{"q":"According to recent scientific studies, which weight-loss plan has been proven to be effective for significant long-term (2 years or more) weight loss?","o":["Atkins diet","Ornish diet","Weight Watchers diet","Zone diet","None of the above"],"a":4},{"q":"Which weight-loss plan contains the lowest amount of dietary fat?","o":["Atkins diet","Ornish diet","Weight Watchers diet","Zone diet"],"a":1},{"q":"Which weight-loss plan contains the lowest amount of dietary carbohydrate?","o":["Atkins diet","Ornish diet","Weight Watchers diet","Zone diet"],"a":0},{"q":"Which weight loss plan is also known as the 40-30-30 diet?","o":["Atkins diet","Ornish diet","Weight Watchers diet","Zone diet"],"a":3},{"q":"What does 40-30-30 represent?","o":["40% carbohydrate (CHO) and 30% each protein and fat","40% fat and 30% each protein and CHO","40% protein and 30% each fat and CHO","40 lb lost in the 1st 6 months, 30 lb lost in subsequent 6-month periods"],"a":0},{"q":"Which weight-loss plan induces ketosis?","o":["Atkins diet","Ornish diet","Weight Watchers diet","Zone diet"],"a":0},{"q":"Which activity is most likely to result in appropriate weight loss?","o":["Daily physical activity meeting the Surgeon General’s recommendations","Strength training two days per week","Aerobic exercise of sufficient duration/intensity to expend > 2000 kcal per week","Exercise in heat and humidity to induce heavy sweating"],"a":2},{"q":"The primary characteristic of type 2 diabetes is:","o":["lack of insulin production.","insulin resistance.","overproduction of glucagon.","hypoglycemia."],"a":1},{"q":"The majority of people who have type 2 diabetes are:","o":["underweight.","at a healthy weight.","obese."],"a":2},{"q":"Common symptoms in individuals with type 2 diabetes include:","o":["hypoglycemia and hypoinsulinemia.","hypoglycemia and hyperinsulinemia.","hyperglycemia and hypoinsulinemia.","hyperglycemia and hyperinsulinemia."],"a":3},{"q":"Choose the best description of insulin resistance from among the following.","o":["The pancreas fails to produce insulin due to damage to alpha (α) cells.","The pancreas produces insulin but fails to secrete a sufficient amount when blood glucose is high.","The pancreas secretes insulin, but the insulin does not work as effectively on the tissue receptors.","The pancreas secretes glucagon instead of insulin in response to high blood glucose."],"a":2},{"q":"Exercise is effective for those with type 2 diabetes because it:","o":["stimulates the pancreas to secrete more insulin.","has a strong insulin-like effect and stimulates glucose uptake into muscles.","helps repair the alpha (α) cells in the pancreas.","improves aerobic fitness."],"a":1},{"q":"The development of fatty streaks, a change associated with eventual narrowing of the arteries, typically begins in:","o":["childhood and adolescence.","early adulthood (20s and 30s).","middle adulthood (40s and 50s).","older adulthood (60s and beyond)."],"a":0},{"q":"Which of the following is NOT a major risk factor for heart disease?","o":["Cigarette smoking","Hypertension","Low total blood cholesterol concentration","Low concentration of high-density lipoprotein cholesterol"],"a":2},{"q":"Which is/are of importance in the prediction of the risk of heart disease?","o":["Total cholesterol below 200 mg/dl","High-density lipoprotein cholesterol greater than 60 mg/dl","Low-density lipoprotein cholesterol less than 100 mg/dl","B and C only","all of the above"],"a":4},{"q":"Low bone mineral density with structural deterioration is known as:","o":["osteomalacia.","osteopenia.","osteoporosis.","osteoarthritis."],"a":2},{"q":"At what age does peak bone mineral density occur (assuming that calcium intake is adequate)?","o":["10 to 20 years","20 to 35 years","35 to 60 years","After age 6"],"a":1},{"q":"The period of time associated with the most rapid loss of bone mass is:","o":["age 20 to 35 years.","age 35 to 50 years.","the first several years after menopause.","after males are 65 years or older."],"a":2},{"q":"Strong scientific evidence exists which suggests that diets high in _____ increase heart disease risk.","o":["trans fatty acids","monounsaturated fats","polyunsaturated fats","all of the above"],"a":0},{"q":"What are the known benefits of strength training and weight bearing activities for post-menopausal women?","o":["Increases leg muscle strength","Increases stability","Increases bone density","a and b","all of the above"],"a":4},{"q":"On average, the bone density of men and African American women is approximately _____ greater than that of Caucasian women.","o":["5%","20%","35%","65%"],"a":1},{"q":"When compared to recommendations made for other chronic diseases, the diet and exercise recommendations made for preventing lifestyle-related cancers are:","o":["similar.","different in many respects.","substantially different.","in opposition to other recommendations."],"a":0},{"q":"What is body mass index (BMI)?","o":["A measure of how much muscle mass an athlete should have","A method of measuring body composition","A formula that predicts the best weight for performance and health","A number that represents a weight-to-height ratio"],"a":3},{"q":"The most appropriate use of body mass index (BMI) is to determine:","o":["potential health risks in the general population","potential health risks in the athletic population.","ideal weight for adults.","ideal weight for athletes."],"a":0},{"q":"_____ is a hormone produced by fat cells and plays an important role in long-term energy balance and weight maintenance.","o":["Leptin","Adrenaline","Ghrelin","Serotonin"],"a":0},{"q":"Ghrelin is a hormone synthesized by cells in the stomach and its primary role in the body is to:","o":["decrease appetite.","stimulate appetite.","induce a feeling of satiety.","a and c"],"a":1},{"q":"It is inevitable that former athletes gain weight as body fat as they age.","o":["True","False"],"a":1},{"q":"There is a steady decline in physical activity as people age.","o":["True","False"],"a":0},{"q":"There is a strong inverse relationship between physical activity and premature mortality.","o":["True","False"],"a":0},{"q":"Chronic diseases can begin in infancy, childhood, adolescence, and young adulthood.","o":["True","False"],"a":0}]},"deep":{"1":[["Training and nutrition belong in one plan","Exercise physiology explains the body’s acute responses and long-term adaptations to training. Sports nutrition applies that science to energy, macronutrients, micronutrients, fluid, recovery, and performance. Recommendations must match the athlete’s sport, position, training phase, goals, preferences, budget, culture, medical history, and access to food. A strategy used by an elite endurance athlete is not automatically appropriate for a recreational strength athlete."],["Training principles that change nutrition needs","Overload creates an adaptation signal; progression changes that signal over time; specificity means the response reflects the work performed; recovery allows adaptation to occur. Periodization changes volume, intensity, and specificity across the year. Nutrition should follow those changes rather than remain fixed: higher-load phases usually need more total energy and carbohydrate, while recovery phases may need less energy but still require protein and micronutrient adequacy."],["Dietary standards and food labels","The DRI is an umbrella system. The RDA meets the needs of nearly all healthy people in a life-stage and sex group; the AI is used when evidence is insufficient for an RDA; the EAR meets the estimated need of half a group and helps assess populations; the UL is the highest usual intake unlikely to create harm. On labels, serving size, calories, nutrients, and percent Daily Value help compare foods, but athlete requirements may differ from the general label reference."],["Evidence and professional judgment","Case reports can generate questions but do not prove a general effect. Epidemiological research identifies associations but cannot establish causation by itself. Experimental studies are stronger when they include an appropriate comparison, random assignment, blinding, valid measurements, and enough participants. One study rarely settles a question; peer review, replication, consistency, effect size, and relevance to the client all matter."],["Credentials and scope","Credentials differ in education, supervised practice, examination, and legal recognition. A nutrition professional should know what assessment, education, counselling, diagnosis, supplementation, and medical nutrition activities are permitted locally. Good practice includes informed consent, documentation, referral, and collaboration with physicians, dietitians, mental-health professionals, athletic therapists, and coaches when the client’s needs cross professional boundaries."]],"2":[["Energy, work, and power","Energy is the capacity to do work. Food energy is stored as chemical energy and can be converted into mechanical work, heat, and other biological processes. Power describes the rate at which work is performed, so two athletes may complete the same work but differ in power. The first law of thermodynamics explains that energy is transformed rather than created or destroyed; the second law explains why every conversion releases some energy as heat."],["ATP is the immediate energy currency","Adenosine triphosphate links energy-releasing reactions to energy-requiring work. Breaking the terminal phosphate bond forms ADP and inorganic phosphate and releases usable energy. Stored ATP is very limited, so it must be continuously resynthesized through the creatine-phosphate system, glycolysis, and oxidative phosphorylation. Food does not directly power a muscle contraction; nutrients supply the pathways that rebuild ATP."],["Calories, kilocalories, and kilojoules","In nutrition, one Calorie with a capital C is one kilocalorie, the energy needed to raise one kilogram of water by one degree Celsius. One kilocalorie equals about 4.184 kilojoules. Carbohydrate and protein provide about 4 kcal per gram, fat about 9 kcal per gram, and alcohol about 7 kcal per gram. These are physiological estimates rather than proof that every consumed calorie is absorbed and used identically."],["Measuring energy expenditure","Direct calorimetry measures heat released by the body but is expensive and impractical for most sport settings. Indirect calorimetry estimates energy expenditure from oxygen consumption and carbon-dioxide production. The respiratory exchange ratio helps estimate the mix of carbohydrate and fat being oxidized: values near 0.70 indicate mostly fat and values near 1.00 indicate mostly carbohydrate, although non-steady-state exercise complicates interpretation."],["Components of daily energy expenditure","Basal or resting metabolism supports essential functions and is usually the largest component. The thermic effect of food reflects digestion, absorption, and processing. Physical activity includes planned exercise and non-exercise movement. Growth, tissue repair, temperature, illness, pregnancy, and training adaptation can also influence needs. Body size and fat-free mass are major determinants of resting expenditure."],["Energy balance and availability","Energy balance compares intake with total expenditure over time. A persistent positive balance supports tissue gain; a persistent negative balance supports loss. Energy availability asks how much dietary energy remains for normal physiology after exercise expenditure. An athlete can maintain a stable scale weight while under-fuelling because the body reduces reproductive, skeletal, immune, and metabolic functions."],["Estimating requirements in practice","Equations, activity factors, food records, and wearable devices all contain error. Start with an estimate, then monitor performance, recovery, hunger, mood, menstrual function, injuries, sleep, and weight trends. Adjust gradually. Large unexplained changes, persistent fatigue, or suspected low energy availability deserve assessment and, when indicated, medical referral."]],"3":[["The three ATP-producing systems","The phosphagen system uses stored ATP and creatine phosphate to supply very rapid energy for a few seconds. Anaerobic glycolysis breaks glucose or glycogen into pyruvate and can rapidly form ATP; when oxidation cannot keep pace, lactate production helps regenerate NAD+ so glycolysis can continue. Oxidative metabolism in mitochondria uses carbohydrate, fat, and sometimes amino acids to produce much more ATP, but at a slower rate."],["Systems overlap rather than switch","All three systems contribute from the start of exercise. Their relative contribution changes with intensity, duration, training status, oxygen delivery, and fuel availability. A maximal jump relies heavily on phosphagen energy; a hard one-minute effort relies strongly on glycolysis; a long steady session relies mainly on oxidative metabolism. Team sports repeatedly move among these demands."],["Glycolysis and lactate","Glycolysis occurs in the cytosol and can begin with blood glucose or muscle glycogen. Glycogen yields a small energetic advantage because it enters after the first phosphorylation step. Lactate is not simply metabolic waste: it can be transported, oxidized by other tissues, or converted back to glucose in the liver. Fatigue during intense exercise reflects several interacting changes, not lactate alone."],["Mitochondrial oxidation","Pyruvate can become acetyl-CoA and enter the Krebs cycle. Fatty acids undergo beta-oxidation to form acetyl-CoA. The Krebs cycle transfers high-energy electrons to NADH and FADH2, and the electron transport chain uses those electrons and oxygen to drive ATP synthesis. Oxygen is the final electron acceptor, which is why sustained oxidative ATP production depends on adequate oxygen delivery."],["Fuel selection and RER","Lower-intensity exercise uses a larger percentage of fat, while increasing intensity shifts reliance toward carbohydrate because carbohydrate can supply ATP more rapidly. Absolute fat oxidation may rise from rest to moderate intensity before falling at high intensity. RER is useful during steady-state exercise but becomes less precise during very hard work, recovery, or conditions that alter ventilation."],["Oxygen deficit, VO2, and recovery","At exercise onset, oxygen consumption takes time to meet demand, producing an oxygen deficit covered by anaerobic systems. After exercise, oxygen consumption remains elevated during EPOC as ATP and phosphagen stores recover, lactate is processed, temperature and hormones normalize, and circulation and ventilation remain elevated. VO2max reflects maximal oxygen uptake and depends on delivery, utilization, genetics, and training."],["Training adaptations and nutrition","Endurance training increases mitochondria, oxidative enzymes, capillaries, and the ability to use fat at a given workload, which can spare glycogen. Sprint and strength training improve phosphagen capacity, glycolytic enzymes, buffering, and neuromuscular output. Nutrition supports these adaptations through sufficient energy, carbohydrate for quality work, protein for repair, fluid, and micronutrients."]],"4":[["Carbohydrate structure","Monosaccharides include glucose, fructose, and galactose. Disaccharides include sucrose, lactose, and maltose. Starches are digestible glucose polymers, while fibre includes carbohydrate structures that resist digestion in the small intestine. “Simple” and “complex” describe structure, not automatically nutritional quality; the food matrix, fibre, processing, and total diet matter."],["Digestion, absorption, and blood glucose","Digestion begins in the mouth with salivary amylase, pauses in the acidic stomach, and continues in the small intestine with pancreatic amylase and brush-border enzymes. Glucose and galactose use sodium-dependent transport; fructose uses a different transporter. Monosaccharides enter portal blood and travel to the liver. Insulin promotes glucose uptake and storage after eating, while glucagon supports blood glucose between meals and during exercise."],["Glycogen storage and limits","The liver stores glycogen to help maintain blood glucose. Skeletal muscle stores glycogen for its own contractions because muscle cannot release free glucose into the blood. Total stores are limited and vary with body size, muscle mass, diet, and training. Depletion contributes to fatigue during prolonged or repeated high-intensity exercise."],["Daily carbohydrate needs","Requirements rise with training volume and intensity. A general sports range is roughly 3–10 g/kg/day, with very high-volume endurance work sometimes reaching about 12 g/kg/day. The target should reflect the actual session, not the athlete’s identity alone. Lower-load days may require less; long or intense days require more."],["Before and during exercise","One to four hours before activity, a familiar carbohydrate-rich meal or snack can support liver and muscle glycogen. Portion size usually increases when more time is available. During sustained high-intensity, endurance, or intermittent exercise, about 30–60 g/hour is common; ultraendurance events may use up to about 90 g/hour from multiple transportable carbohydrates. Fluid, concentration, flavour, and GI tolerance must be practised."],["Recovery and glycogen restoration","When recovery time is short, begin carbohydrate soon after exercise. The chapter uses about 1.5 g/kg in the first hour and additional carbohydrate over the next several hours. Medium- to high-glycemic foods can accelerate insulin response and glycogen synthesis. Protein supports repair and can help when carbohydrate intake is suboptimal, but it does not replace carbohydrate for glycogen."],["Fibre, glycemic index, and carbohydrate loading","Fibre supports bowel health, cholesterol management, and microbiota, but a large high-fibre meal close to intense exercise can cause distress. Glycemic index compares blood-glucose response to a fixed amount of available carbohydrate; glycemic load also considers portion size. Carbohydrate loading combines tapering with high carbohydrate intake before long endurance events and is unnecessary for brief activity."]],"5":[["Amino acids and protein structure","Proteins are chains of amino acids folded into specific shapes. Nine amino acids are essential because the body cannot synthesize enough of them. Nonessential amino acids can be produced, while conditionally essential amino acids may become limited during illness, injury, or other stress. Protein function depends on both amino-acid sequence and three-dimensional structure."],["Digestion and the amino-acid pool","Stomach acid denatures protein and activates pepsin. Pancreatic proteases and intestinal peptidases produce amino acids and small peptides for absorption. The amino-acid pool supplies tissue synthesis, enzymes, hormones, transport proteins, immune molecules, and other compounds. The body has no dedicated protein-storage depot, so excess amino acids are deaminated and their carbon skeletons are oxidized or stored."],["Protein turnover and nitrogen balance","Muscle and other proteins are continually synthesized and broken down. Positive nitrogen balance occurs when synthesis and retention exceed loss, as during growth or well-supported hypertrophy. Negative balance can occur with severe energy restriction, illness, injury, or inadequate protein. Exercise stimulates turnover; training adaptation depends on both the stimulus and recovery nutrition."],["Protein quality","High-quality proteins provide all essential amino acids in digestible proportions. Animal foods generally score highly, but plant-based diets can meet needs through adequate total intake and variety. Legumes, soy foods, grains, nuts, seeds, and fortified foods contribute. Complementary proteins do not have to be eaten in the same mouthful when the overall diet is adequate."],["Athlete requirements and distribution","The course uses about 1.2–2.0 g/kg/day for many athletes when energy intake is adequate. Needs vary with sport, training phase, age, energy deficit, injury, and goal. Distribution across three to five eating occasions usually provides repeated opportunities for muscle protein synthesis. A practical serving often supplies about 20–40 g of high-quality protein, depending on body size and context."],["Endurance, strength, and recovery","Endurance athletes need protein for mitochondrial, enzyme, and structural adaptation and may oxidize more amino acids during long or glycogen-depleted exercise. Strength athletes need sufficient protein and energy to support hypertrophy, but progressive resistance training is the central stimulus. After training, protein supports repair; adding carbohydrate helps restore glycogen and total energy."],["Supplements and common misconceptions","Protein powder can be convenient but is not inherently more anabolic than an equivalent food protein. Branched-chain amino acids provide only part of the essential-amino-acid pattern and are less useful than a complete protein when the diet is inadequate. Very high intake does not guarantee more muscle and may displace carbohydrate, fat, fibre, and micronutrient-rich foods."]],"6":[["Fatty-acid structure","Saturated fatty acids contain no carbon-carbon double bonds. Monounsaturated fats contain one; polyunsaturated fats contain two or more. Cis double bonds bend the chain, while trans bonds keep it straighter. Chain length and saturation influence melting point, digestion, transport, and oxidation. Omega-3 and omega-6 fatty acids are essential families because humans cannot create the first double bond in those positions."],["Triglycerides, phospholipids, and sterols","Most dietary fat is triglyceride: glycerol plus three fatty acids. Phospholipids contain a phosphate group and form cell membranes and emulsifiers. Sterols have a ring structure; cholesterol supports membranes, bile acids, vitamin D, and steroid hormones. Cholesterol occurs in animal foods, but blood cholesterol is also strongly influenced by genetics and the overall dietary-fat pattern."],["Digestion and transport","Lingual and gastric lipases make a small contribution, while most digestion occurs in the small intestine. Bile emulsifies fat and pancreatic lipase releases fatty acids and monoglycerides. These form micelles, enter intestinal cells, are rebuilt into triglycerides, and travel in chylomicrons through lymph to blood. Shorter-chain fatty acids can reach portal blood more directly."],["Lipoproteins and storage","Lipoprotein lipase helps tissues remove fatty acids from circulating triglycerides. Chylomicrons carry dietary fat; VLDL carries triglyceride made or packaged by the liver; LDL delivers cholesterol to tissues; HDL participates in reverse cholesterol transport. Excess energy can be stored efficiently in adipose tissue, while intramuscular triglyceride provides a local fuel source."],["Mobilization and beta-oxidation","Hormonal signals activate lipolysis, releasing fatty acids and glycerol from stored triglycerides. Fatty acids travel bound to albumin, enter muscle, and are activated. Long-chain fatty acids use the carnitine shuttle to cross the inner mitochondrial membrane. Beta-oxidation removes two-carbon units as acetyl-CoA, which enters the Krebs cycle and electron transport chain. Fat oxidation is aerobic and relatively slow."],["Exercise intensity and the “fat-burning zone”","At rest and low intensity, fat supplies a high percentage of energy, but total expenditure may be low. Absolute fat oxidation often peaks at moderate intensity and drops as intensity rises because carbohydrate can provide ATP faster. The percentage of fat used during one workout does not determine long-term body-fat change; total energy balance and sustainable activity matter more."],["Intake, timing, and supplements","A practical benchmark is about 1.0 g/kg/day or 20–35% of energy after carbohydrate and protein needs are considered. Emphasize unsaturated fats, nuts, seeds, avocado, oils, and fish while limiting trans fat and excessive saturated fat. Large high-fat meals delay gastric emptying and may be uncomfortable before exercise. Carnitine, MCTs, and most “fat burners” have not shown reliable performance benefits."]],"7":[["Body-water compartments","Water makes up a large and variable portion of body mass. Intracellular fluid is inside cells; extracellular fluid includes plasma and interstitial fluid. Electrolytes help maintain fluid distribution: potassium is the major intracellular cation, while sodium is the major extracellular cation. Water supports circulation, nutrient transport, waste removal, chemical reactions, lubrication, and temperature control."],["Water balance and regulation","Intake comes from beverages, food, and metabolic water. Loss occurs through urine, sweat, respiration, and feces. Osmolality and blood volume influence thirst and hormones such as antidiuretic hormone and aldosterone. The kidneys adjust water and sodium excretion. Balance is dynamic, so a single urine sample or thirst rating cannot describe every aspect of hydration."],["Sweating and thermoregulation","Exercise produces heat. Skin blood flow and sweat evaporation help transfer that heat to the environment. Evaporation, not sweat dripping from the skin, provides cooling. Heat and humidity, clothing, body size, metabolic rate, acclimatization, and airflow change sweat rate and heat strain. High humidity reduces evaporation even when sweating is heavy."],["Consequences of dehydration","A fluid deficit reduces plasma volume, increases cardiovascular strain, impairs heat dissipation, and raises perceived effort. Performance effects become more likely as dehydration grows, especially during endurance activity in heat. Symptoms are not specific, so headache, fatigue, nausea, or poor performance should be interpreted with the full context. Severe heat illness requires urgent medical action."],["Assessing hydration and sweat rate","Useful field measures include body-mass change, fluid intake, urine output, urine colour, thirst, and environmental conditions. Sweat rate can be estimated from pre- and post-session body mass plus fluid consumed and urine produced. One kilogram of mass change is approximately one litre of water. Repeat testing in different weather and sessions because sweat rate varies."],["Before, during, and after exercise","Begin activity normally hydrated. The chapter uses about 5–10 mL/kg in the two to four hours before exercise, with additional fluid when urine remains dark or output is low. During exercise, use an individualized plan that limits excessive dehydration without producing weight gain. Afterward, about 1.25–1.5 L per kilogram lost helps replace the deficit and ongoing urine losses."],["Sodium and hyponatremia","Sodium losses vary with sweat volume and concentration. Long-duration exercise, heavy salty sweating, and limited recovery may require sodium-containing foods or beverages. Exercise-associated hyponatremia usually involves drinking beyond losses, which dilutes blood sodium; sodium intake alone cannot make unlimited drinking safe. Avoid routine weight gain during endurance events."]],"8":[["How vitamins differ from energy nutrients","Vitamins are organic compounds needed in small amounts for normal metabolism. They do not provide calories, but many act as coenzymes that help release or transfer energy from carbohydrate, fat, and protein. Requirements can rise when food intake and metabolic work rise, yet athletes who eat enough varied food usually obtain adequate amounts without high-dose supplements."],["Fat-soluble vitamins","Vitamins A, D, E, and K are absorbed with dietary fat and can be stored. Vitamin A supports vision, epithelial tissue, immunity, and cell differentiation. Vitamin D regulates calcium and bone metabolism and has broader physiological roles. Vitamin E protects lipid membranes from oxidation. Vitamin K is required for blood-clotting proteins and participates in bone metabolism. Storage increases the risk of toxicity from excessive supplements."],["Water-soluble vitamins","The B vitamins participate in energy metabolism, red-blood-cell formation, amino-acid metabolism, and DNA synthesis. Thiamin, riboflavin, niacin, pantothenic acid, biotin, vitamin B6, folate, and vitamin B12 have distinct roles. Vitamin C supports collagen synthesis, antioxidant systems, immune function, and nonheme-iron absorption. Most water-soluble vitamins have limited storage, although vitamin B12 is an important exception."],["Deficiency and performance","A true deficiency can impair performance by disrupting energy metabolism, oxygen transport, bone health, immunity, or tissue repair. Correcting the deficiency can restore function. When status is already adequate, additional vitamins do not create extra energy or automatically improve performance. Symptoms such as fatigue are nonspecific and should not be self-diagnosed as a vitamin deficiency."],["Antioxidants and exercise adaptation","Exercise increases reactive oxygen species, which can damage tissue at high levels but also act as signals for adaptation. Food-based antioxidant systems include vitamins C and E, carotenoids, selenium-dependent enzymes, and many phytochemicals. Very large antioxidant doses may interfere with some training signals and do not replace recovery, sleep, and adequate energy."],["Athletes at greater risk","Risk rises with low energy availability, restrictive diets, food allergies without replacement foods, vegan diets without vitamin B12 planning, limited sun exposure, malabsorption, illness, and some medications. Indoor athletes and people living at northern latitudes may need vitamin D assessment. Pregnant athletes and adolescents have additional life-stage needs."],["Supplement safety","Compare the amount per serving with the RDA or AI and the UL, account for fortified foods and multiple products, and avoid assuming that “natural” means safe. Fat-soluble vitamins and high-dose B6, niacin, folic acid, or vitamin C can cause harm. Targeted supplementation should respond to assessed intake, laboratory findings, or a recognized life-stage recommendation."]],"9":[["Classification and homeostasis","Macrominerals are required in larger amounts and include calcium, phosphorus, magnesium, sodium, potassium, chloride, and sulfur. Trace minerals include iron, zinc, copper, selenium, iodine, chromium, manganese, molybdenum, and others. The body regulates absorption, transport, storage, and excretion to keep concentrations within a narrow range. More intake does not always produce more absorption."],["Factors that affect absorption","Mineral form, dose, nutritional status, age, intestinal health, and meal composition all matter. Phytates and oxalates can bind minerals; large doses of one mineral can compete with another. Vitamin C improves nonheme-iron absorption, while heme iron is absorbed more efficiently. The body may trap iron in intestinal cells and lose it when those cells are shed."],["Calcium, phosphorus, magnesium, and bone","Bone is both structural tissue and a mineral reservoir. Osteoblasts build bone, osteoclasts resorb it, and osteocytes help coordinate the response to loading. Trabecular bone turns over faster than cortical bone. Calcium and phosphorus form mineral crystals; magnesium contributes to structure and enzyme function. Vitamin D and parathyroid hormone help regulate blood calcium."],["Iron and oxygen transport","Iron is part of hemoglobin, which carries oxygen in blood, and myoglobin, which stores and transfers oxygen in muscle. Ferritin reflects storage. Iron-deficiency anemia lowers hemoglobin and impairs oxygen transport, aerobic capacity, and endurance. Risk is greater with menstruation, endurance running, low energy intake, vegetarian diets without planning, gastrointestinal loss, and frequent blood donation."],["Fluid and neuromuscular minerals","Sodium and chloride dominate extracellular fluid; potassium is concentrated inside cells. Their gradients support fluid balance, nerve impulses, and muscle contraction. Sweat contains water and electrolytes, especially sodium. Most losses are replaced through food and beverages, but prolonged heavy sweating may require a targeted plan. Potassium supplements are rarely a substitute for fruit, vegetables, legumes, dairy, and other foods."],["Zinc, selenium, iodine, and chromium","Zinc supports hundreds of enzymes, immunity, protein synthesis, and wound healing. Selenium forms part of antioxidant enzymes. Iodine is required for thyroid hormones. Chromium is associated with insulin action, but supplementation has not reliably increased muscle or improved performance. Both deficiency and excess can cause harm; high-dose zinc can impair copper and iron metabolism."],["Food first and targeted testing","Adequate energy and a varied diet usually cover mineral needs. Supplements are most appropriate when a deficiency, dietary gap, or medical indication has been identified. Iron should not be prescribed from symptoms alone because fatigue has many causes and iron overload is harmful. Calcium and vitamin D concerns should be considered alongside energy availability and bone-loading activity."]],"10":[["The diet-planning sequence","The chapter defines diet as the food and beverages a person usually consumes. Planning starts with total energy because every nutrient target must fit inside that energy budget. Next establish carbohydrate according to training demand, then protein, and then use fat to complete the prescription. Alcohol supplies energy but is not an essential nutrient and is commonly reduced when an energy deficit is needed."],["Energy ranges and nutrient density","Energy needs vary widely. The chapter’s table starts near 25 kcal/kg/day for a sedentary female and uses about 30 kcal/kg/day as a practical minimum for athletes. Nutrient density compares nutrients with calories: skim milk is more nutrient dense than whole milk because it provides similar vitamins, minerals, and protein for fewer calories. Nutrient-dense food becomes especially important when intake is restricted."],["Food-pattern planning","Healthy eating patterns translate calorie and nutrient targets into food-group amounts. They are educational frameworks, not individualized prescriptions. A useful athlete plan distributes grains or other carbohydrate foods, protein foods, dairy or fortified alternatives, vegetables, fruit, and fats across meals and snacks. Cooking ability, budget, culture, travel, and dining-out options determine whether the plan is usable."],["Pre-exercise goals and tolerability","The pre-exercise meal should provide carbohydrate, support hydration, prevent hunger, and minimize gastrointestinal distress. The chapter recommends about 1–4 g carbohydrate/kg in the one to four hours before exercise. Larger meals require more time. Moderate fat several hours before activity can improve satiety, but large amounts of fat, fibre, protein, or unfamiliar food close to exercise may slow gastric emptying or increase symptoms."],["During-exercise intake","During prolonged endurance and intermittent high-intensity sport, carbohydrate helps maintain blood glucose, spare liver glycogen, and delay fatigue. The common target is 30–60 g/hour; ultraendurance activity may use up to 90 g/hour from multiple transportable carbohydrates. Fluid should follow an individualized plan based on sweat rate, weather, clothing, access, and tolerance. Long events may require sodium, but overdrinking must be avoided."],["Recovery nutrition","After exercise, carbohydrate restores glycogen, protein supplies amino acids for repair, and fluid replaces losses. When rapid recovery is important, the chapter uses about 1.5 g carbohydrate/kg in the first hour and 0.75–1.5 g/kg/hour over the next several hours, plus about 15–25 g high-quality protein soon after. Rehydration begins promptly and continues with sodium-containing foods and drinks."],["Popular eating patterns","Vegetarian patterns exclude meat; vegan patterns exclude all animal products. Both can support performance when energy, protein, iron, zinc, calcium, vitamin D, iodine, omega-3 fats, and vitamin B12 are planned. Other popular diets should be judged by nutritional adequacy, sustainability, training compatibility, GI tolerance, and evidence, not by the athlete testimonials used to market them."],["Caffeine, alcohol, and supplements","Caffeine is a legal central-nervous-system stimulant that can improve alertness and reduce perceived effort, but dose and timing affect sleep, anxiety, heart rate, and blood pressure. Alcohol does not improve performance and can impair rehydration, glycogen restoration, muscle repair, and judgment. Supplements should be screened for legality, ethics, purity, safety, and effectiveness; training and an adequate diet remain the foundation."],["Nutrition periodization","A comprehensive plan changes with preparation, competition, travel, injury, and active recovery. Energy and carbohydrate usually rise with demanding training and fall when load drops; protein remains distributed to support repair; hydration and competition practice become more specific as events approach. The athlete should rehearse the plan during training and use monitoring data to refine it."]],"11":[["Body-composition terminology","Body mass is the amount of matter; body weight is the force of gravity on that mass. Fat mass includes essential and storage fat. Fat-free mass includes muscle, bone, organs, connective tissue, and water. Lean body mass is often used similarly but can include essential lipid. Somatotypes describe tendencies (ectomorph, mesomorph, and endomorph) but do not dictate health or performance."],["Every field method is an estimate","Only chemical analysis of a cadaver directly measures body composition. Hydrodensitometry estimates density from underwater weight; plethysmography uses displaced air; skinfolds estimate subcutaneous fat; bioelectrical impedance depends heavily on body water; DEXA separates bone mineral, lean tissue, and fat using low-energy X-rays. Hydration, meals, recent exercise, technician skill, equipment, and equations affect results."],["Understanding the SEE","The standard error of the estimate describes typical prediction error. If underwater weighing reports 13% body fat with an SEE of about 2.7 percentage points, a reasonable interpretation is approximately 10.3–15.7%, not exactly 13%. Small changes within measurement error should not drive major diet decisions. Use the same method and standardized conditions when tracking trends."],["Sport performance and interpretation","Size and composition matter differently by sport and position. A high power-to-weight ratio helps sports requiring acceleration, jumping, or climbing; larger mass may help collision or throwing roles. Published elite-athlete ranges describe successful groups but do not prove the optimal target for an individual. BMI can misclassify muscular athletes because it does not separate fat and lean tissue."],["Target-weight calculations","A target-weight calculation starts with fat-free mass. Estimated target weight equals current fat-free mass divided by one minus the desired body-fat fraction. For example, an athlete with 70 kg fat-free mass targeting 15% body fat would estimate 70 ÷ 0.85 = 82.4 kg. The answer is a planning estimate and depends on accurate assumptions about lean mass and a realistic healthy target."],["Increasing muscle mass","Hypertrophy requires progressive resistance training, adequate energy, and positive nitrogen balance. The chapter emphasizes moderate-load, higher-volume strength work. A starting energy increase is roughly 400–500 kcal/day for men and 300–400 kcal/day for women, adjusted from weight, training, appetite, and composition trends. The chapter’s rule of thumb adds about 14 g protein/day for one pound of weekly muscle gain, though real gain is rarely perfectly linear."],["Reducing body fat","Any exercise can contribute when it helps create an appropriate energy deficit. The chapter protects training with at least about 30 kcal/kg/day and 4 g carbohydrate/kg/day. Large changes belong in the off-season or active-recovery phase because aggressive restriction competes with training quality, recovery, immunity, hormonal function, and injury prevention. Aim for gradual change and monitor both performance and health."],["Weight cycling and lightweight sport","Weight cycling is repeated loss and regain, often intensified by weigh-ins and dehydration. Research does not consistently show a permanent metabolic-rate reduction, but athletes may experience fatigue, anger, tension, poor training, dehydration, and impaired performance. Minimum-weight calculations should protect health rather than identify the lowest number an athlete can force temporarily."],["Drugs and supplements","Anabolic steroids mimic testosterone and can increase muscle but are prohibited and carry cardiovascular, hepatic, reproductive, psychiatric, and other risks. Prohormones such as DHEA are marketed as testosterone precursors, yet effectiveness is weak and safety uncertain. Ephedrine has medical uses but stimulant combinations have caused serious adverse events. Human evidence for CLA and many “fat burners” remains inconsistent."]],"12":[["Normal eating, disordered eating, and eating disorders","Normal eating is flexible, varied, and responsive to hunger, fullness, schedule, culture, and enjoyment. Disordered eating describes harmful restriction, bingeing, purging, rigid rules, or compensatory exercise that may not meet a formal diagnosis. Eating disorders meet clinical criteria and are serious psychiatric illnesses. People can move along this continuum, making early recognition important."],["Major clinical patterns","Anorexia nervosa involves restriction, significantly low weight, and intense fear of weight gain or behaviours that prevent restoration. Bulimia nervosa includes recurrent binge episodes and compensatory behaviours. Binge-eating disorder includes recurrent binges without regular compensation. Other specified disorders can be equally serious even when every classic criterion is not present. Diagnosis belongs to qualified clinicians."],["Athlete-specific presentations","Anorexia athletica describes sport-related restriction, excessive exercise, and weight cycling but is not a DSM-5 diagnosis. Muscle dysmorphia involves persistent belief that the body is insufficiently muscular. Exercise dependence is defined by compulsion, distress, injury, and impaired functioning, not a universal mileage threshold. Seasonal “making weight” behaviours can still be medically dangerous even when they do not reflect a persistent eating disorder."],["Higher-risk sport environments","Risk is elevated when leanness is believed to improve performance, appearance is judged, revealing uniforms increase body scrutiny, or weight classes require certification. Examples include gymnastics, ballet, figure skating, distance running, cycling, bodybuilding, combat sports, jockeying, and lightweight rowing. Athletes of all genders can be affected; male presentations are under-recognized."],["Healthy discipline versus dysfunction","Both healthy and disordered athletes may meal-plan, train consistently, or avoid some foods. Warning signs include escalating rigidity, fear, secrecy, guilt, bingeing, purging, compulsive exercise, social withdrawal, frequent weighing, injury, declining performance, delayed recovery, menstrual disruption, low libido, and distress when routines change. A stable body weight does not rule out low energy availability."],["Energy availability and physiological effects","Energy availability is dietary energy remaining for normal body functions after exercise energy expenditure, relative to fat-free mass. Chronic low availability can suppress resting metabolism, reproductive hormones, bone formation, immunity, protein synthesis, gastrointestinal function, and cardiovascular health. Consequences include fatigue, illness, mood change, reduced adaptation, stress injuries, and poorer long-term performance."],["Female Athlete Triad and RED-S","The Triad links energy availability, menstrual function, and bone mineral density along three continua. Amenorrhea is a warning sign, not a normal consequence of hard training. Reduced estrogen and nutrient inadequacy accelerate bone loss and stress-fracture risk. RED-S broadens the model to athletes of all genders and includes many health and performance systems affected by low energy availability."],["Approach, referral, and prevention","Speak privately, use observed facts rather than labels or appearance, express concern, listen, and refer promptly. Coaches should not prescribe target weights or act as the treatment provider. Effective care may involve a physician, eating-disorder-informed dietitian, mental-health clinician, athletic therapist, and family. Prevention includes adequate fuelling, flexible eating, weight-neutral coaching language, confidential referral pathways, and policies that reduce unnecessary weigh-ins."]],"13":[["From competitive athlete to lifelong activity","Training often declines after school or competitive sport, but weight gain is not inevitable. Energy intake may remain matched to a former workload while daily movement falls. Lifelong health benefits from aerobic activity, resistance training, flexibility, balance, and reduced sedentary time. Former athletes may need a new identity and routine rather than an attempt to recreate peak training."],["Common diet and activity recommendations","Healthy patterns converge on vegetables, fruit, whole grains, legumes, nuts, lean or plant proteins, fish, and unsaturated fats while limiting trans fat, excess saturated fat, sodium, refined grains, added sugars, and heavy alcohol use. Adults commonly aim for at least 150 minutes of moderate aerobic activity or an equivalent amount of vigorous activity each week, plus muscle-strengthening activity on two or more days."],["Body weight regulation","Long-term weight reflects energy intake and expenditure interacting with genetics, appetite, sleep, stress, medications, food availability, and environment. Leptin is produced by fat cells and participates in long-term energy regulation. Ghrelin is produced mainly in the stomach and stimulates appetite. Weight loss triggers compensatory hunger and lower expenditure, which helps explain why maintenance is difficult and requires continued support."],["BMI and abdominal fat","BMI is weight in kilograms divided by height in metres squared. It is a population screening tool, not a direct measure of fat or an individual diagnosis. A BMI of 30 or more is classified as obesity in the standard adult categories. Waist circumference adds information about abdominal fat and cardiometabolic risk. Muscularity, age, sex, ethnicity, and clinical measures affect interpretation."],["Comparing popular weight-loss plans","Atkins is very low in carbohydrate and may induce ketosis. Ornish is very low in fat. Zone uses approximately 40% carbohydrate, 30% protein, and 30% fat. Weight Watchers emphasizes portion and energy control. Research discussed in the chapter finds similar short-term losses across different plans and no clear named-plan winner for substantial long-term loss over two years or more. Adherence and sustainability dominate."],["Type 2 diabetes and metabolic syndrome","Type 2 diabetes is characterized primarily by insulin resistance. Early in the condition, blood glucose and insulin may both be high because the pancreas compensates. Exercise has an insulin-like effect on muscle glucose uptake and improves sensitivity. Metabolic syndrome is a cluster involving abdominal obesity, high triglycerides, low HDL, high blood pressure, and elevated glucose; three of five criteria establish the diagnosis."],["Cardiovascular disease and hypertension","Atherosclerosis begins early with fatty streaks and develops over decades. Major modifiable risks include smoking, hypertension, high LDL, low HDL, diabetes, inactivity, and excess body fat. Trans fat increases risk; replacing saturated and trans fats with monounsaturated, polyunsaturated, and omega-3-rich foods can help. Total cholesterol, LDL, HDL, triglycerides, blood pressure, and the complete risk profile must be interpreted together."],["Osteoporosis and cancer prevention","Osteoporosis combines low bone mineral density with structural deterioration and fracture risk. Peak bone mass generally develops by the twenties or early thirties, and loss accelerates after menopause. Weight-bearing and resistance activity improve strength, stability, and bone outcomes. Lifestyle-related cancer recommendations largely overlap with other chronic-disease guidance: healthy weight, regular activity, plant-rich food patterns, limited alcohol, and no tobacco."],["Behaviour change and supportive environments","Knowledge is rarely enough. The health-belief model focuses on perceived risk, severity, benefits, and barriers. Social cognitive theory emphasizes expected outcomes, skills, confidence, modelling, and environment. Sustainable counselling uses specific goals, self-monitoring, problem-solving, social support, and relapse planning. Community, school, workplace, and policy changes can make nutritious food and movement easier choices."]]},"lens":{"1":{"takeaway":"My role is to translate evidence into a realistic plan for the person in front of me. I need to ask about the sport, training phase, food access, culture, budget, preferences, health history, and professional boundaries before making a recommendation.","cases":[["The supplement-first client","A recreational lifter arrives with six products but no consistent meals.","Start with goals, dietary intake, training, sleep, and the five-part supplement screen: legality, ethics, purity, safety, and effectiveness."],["The endurance beginner","A new runner copies an elite athlete’s high-carbohydrate plan.","Explain that athlete needs exist on a spectrum and build a plan for the client’s current duration, intensity, body size, and tolerance."],["The nutrition claim online","A client brings a dramatic social-media claim based on one study.","Check study design, population, controls, outcome, replication, and the total body of evidence before changing practice."]],"practice":["Clients often want a quick answer before the assessment is complete.","Credentials and scope are frequently misunderstood.","The most useful recommendation is often a small, repeatable behaviour rather than an advanced protocol."]},"2":{"takeaway":"Energy is the base layer of the nutrition plan. Before adjusting macros, I need to understand energy demand, availability, recovery, and the limits of every estimate.","cases":[["The tired high-volume athlete","Training has increased but food intake has not, and energy, mood, and recovery are falling.","Map training load and daily intake, look for low energy availability, and build easier ways to add energy around training."],["The wearable calorie target","A client treats a device’s energy-expenditure number as exact.","Explain measurement error, use the number as a starting estimate, and adjust from trends in performance, hunger, recovery, and body weight."],["The stalled weight goal","A client reports that the calorie plan “stopped working.”","Review adherence, portions, activity changes, sleep, stress, and normal adaptation without blaming the client."]],"practice":["Energy needs shift across seasons, injuries, travel, and life stress.","Under-fuelling can exist without visible weight loss.","Food records and devices provide estimates, not perfect measurements."]},"3":{"takeaway":"I do not need to turn every client into an exercise physiologist, but I do need to match fuel and recovery to the dominant energy demands of the session and sport.","cases":[["The repeated-sprint athlete","A hockey player fades late in games despite good general fitness.","Review carbohydrate availability, between-session recovery, hydration, and the repeated high-intensity demands of the sport."],["The long easy session","A cyclist assumes every low-intensity ride requires aggressive fuelling.","Match carbohydrate and fluid to duration, goals, conditions, and total daily intake rather than intensity alone."],["The supplement replacing recovery","An athlete buys ATP or “energy-system” products but skips post-training meals.","Refocus on carbohydrate, protein, fluid, sleep, and progressive training before considering any evidence-based supplement."]],"practice":["Most sports use several energy systems at once.","A session’s duration and intensity change which fuel bottleneck matters most.","Fatigue is not always a single-nutrient problem."]},"4":{"takeaway":"Carbohydrate is a performance tool, not a moral category. My job is to scale the amount and timing to training demand while keeping food quality, tolerance, and the whole diet in view.","cases":[["The low-carb endurance athlete","A runner struggles to complete quality sessions after removing most carbohydrate.","Explain glycogen needs and reintroduce tolerable carbohydrate around demanding workouts while monitoring symptoms and confidence."],["The pre-race GI problem","An athlete eats a large high-fibre breakfast shortly before competition.","Test lower-fibre, familiar carbohydrate choices and adjust portion size according to the time available before exercise."],["The double-session day","A team athlete has only a few hours between sessions.","Prioritize rapid carbohydrate intake, fluid, sodium as needed, and protein soon after the first session."]],"practice":["Carbohydrate tolerance is trainable and highly individual.","Fear of sugar can lead athletes to under-fuel competition.","The recovery window matters most when the next hard session is soon."]},"5":{"takeaway":"Protein recommendations work best when I consider the daily total, protein quality, distribution across meals, energy adequacy, and the training stimulus together.","cases":[["The one-shake strategy","A client consumes most daily protein in a large evening shake.","Keep the total appropriate while distributing useful servings across meals and after training."],["The plant-based strength athlete","A vegan athlete worries that muscle gain is impossible without animal protein.","Plan adequate energy, varied protein sources, sufficient total protein, and key nutrients such as iron, calcium, vitamin B12, and vitamin D."],["The high-protein under-fueller","Protein intake is high, but carbohydrate and total energy are too low for training.","Show that protein cannot replace adequate energy and carbohydrate, then rebalance the plan."]],"practice":["Many clients already meet protein needs but distribute it poorly.","Supplements are convenient, not automatically superior to food.","Low energy availability can prevent the expected response to protein and training."]},"6":{"takeaway":"Fat supports health, hormones, membranes, vitamins, and energy intake. I need to improve fat quality and timing without pushing intake so low that health suffers or so high before exercise that digestion becomes a problem.","cases":[["The fat-fearing athlete","A client avoids oils, nuts, avocado, and fatty fish to stay lean.","Reintroduce appropriate unsaturated fats and explain the risks of overly restrictive intake."],["The heavy pre-workout meal","An athlete eats a high-fat meal shortly before intense training and feels sluggish.","Move larger fat portions farther from the session and use a lighter pre-exercise meal."],["The fat-burning-zone goal","A client believes low-intensity exercise guarantees more body-fat loss.","Separate fuel use during one session from long-term energy balance and build an activity plan the client can sustain."]],"practice":["Clients often confuse dietary fat with body fat.","Very low-fat plans can reduce satisfaction and micronutrient intake.","Supplement marketing overstates fat oxidation and weight-loss effects."]},"7":{"takeaway":"Hydration advice should be individualized. The goal is to prevent meaningful dehydration without encouraging overdrinking or ignoring sodium losses, environmental conditions, and access to fluid.","cases":[["The salty sweater","An athlete finishes long summer sessions with salt marks and headaches.","Estimate sweat rate, review fluid access and sodium intake, and build a tested replacement plan."],["The over-hydrator","A runner drinks continuously because clear urine is the goal.","Explain hyponatremia risk and use body-mass change, thirst, conditions, and a planned range rather than unlimited water."],["The morning practice","A youth athlete arrives with dark urine and no breakfast.","Create an evening and morning routine that includes fluids, a familiar snack, and parent-friendly preparation."]],"practice":["Sweat rate can vary greatly in the same person.","Thirst, urine colour, and body weight each give partial information.","Heat, humidity, clothing, and acclimatization change the plan."]},"8":{"takeaway":"Vitamins support metabolism; they do not supply energy. I should look first for low energy intake, limited food variety, clinical risk, and medication or supplement interactions before recommending a product.","cases":[["The megadose antioxidant user","An athlete takes high-dose vitamins C and E to prevent every illness and speed recovery.","Review dose and upper limits, explain that more is not better, and prioritize food sources and appropriate medical evaluation."],["The indoor winter athlete","A client has limited sun exposure and avoids vitamin-D-rich foods.","Assess dietary risk, encourage appropriate testing through a health professional, and use targeted supplementation only when indicated."],["The restricted eater","A low-energy diet removes several food groups.","Restore adequacy and variety, screen for likely gaps, and refer for laboratory assessment when symptoms or risk warrant it."]],"practice":["Deficiency risk often reflects an energy or variety problem.","High-dose products can exceed upper limits quickly.","A supplement may mask one deficiency while leaving the eating pattern unchanged."]},"9":{"takeaway":"Mineral status depends on intake, absorption, losses, and regulation. I should avoid guessing, especially with iron, and use food-first planning plus appropriate testing and referral.","cases":[["The fatigued distance runner","A menstruating runner reports declining endurance and heavy fatigue.","Review intake and risk factors, then refer for appropriate iron-status testing rather than recommending iron blindly."],["The low-calcium athlete","A dairy-free athlete has few fortified alternatives and repeated bone stress injuries.","Assess calcium, vitamin D, energy availability, and loading; coordinate with the healthcare team when indicated."],["The high-zinc supplement","A client takes zinc daily for immunity at a dose near or above the upper limit.","Review total intake, explain copper and iron interactions, and reduce unnecessary high-dose use."]],"practice":["Iron and calcium concerns are common in restrictive eating patterns.","Absorption can matter as much as the number on a food log.","Single-mineral supplements can create new imbalances."]},"10":{"takeaway":"A strong plan connects daily energy and nutrient needs with what the athlete will actually eat before, during, and after training. Periodization turns static advice into a plan that changes with the season.","cases":[["The tournament weekend","An athlete has multiple games, limited breaks, and unfamiliar food options.","Build a portable schedule for carbohydrate, protein, fluid, and sodium using foods the athlete has tested."],["The early-morning trainer","A client cannot tolerate a full breakfast before a 6 a.m. session.","Use a small low-fibre carbohydrate option before training and a complete recovery meal afterward."],["The active-recovery month","Training volume drops, but the competition-season eating pattern continues unchanged.","Adjust energy and carbohydrate while protecting protein, micronutrients, enjoyment, and recovery."]],"practice":["The “perfect” plan fails if it ignores schedule, cooking ability, budget, and food access.","GI tolerance needs rehearsal.","Nutrition periodization should follow the training calendar."]},"11":{"takeaway":"Body-composition numbers are estimates, not identities. I should communicate measurement error, centre health and performance, and avoid creating a false “ideal” body for a sport.","cases":[["The muscular high-BMI client","A strength athlete is labelled “obese” by BMI despite substantial muscle mass.","Explain the limits of BMI, review other health indicators, and avoid treating a screening number as a diagnosis."],["The repeated skinfold check","An athlete’s confidence rises and falls with small weekly changes.","Discuss measurement error, reduce measurement frequency, and shift progress markers toward strength, recovery, and health."],["The rapid cut request","A lightweight athlete wants a large loss during competition season.","Explain the performance and health risks, set boundaries, and coordinate safer long-term planning with the sport healthcare team."]],"practice":["Normal measurement error can be larger than the change a client hopes to see.","Weight goals can become emotionally loaded.","Muscle gain and fat loss require different energy conditions and may be difficult to maximize together."]},"12":{"takeaway":"My responsibility is early recognition, compassionate conversation, and referral, not diagnosis or solo treatment. Weight-centred messaging can do harm even when performance is the stated goal.","cases":[["The missing menstrual cycle","An endurance athlete reports amenorrhea and recurring stress injuries.","Treat this as a health warning, assess fuelling risk within scope, and refer promptly to qualified medical and eating-disorder professionals."],["The compulsive exerciser","A client trains despite injury and severe distress when a session is missed.","Focus on observed impact and safety, avoid debating appearance, and connect the client with an appropriate care team."],["The “clean eating” spiral","Food rules expand until social eating and adequate intake become impossible.","Recognize the rigidity and impairment, use non-judgmental language, and refer while supporting regular adequate nourishment within scope."]],"practice":["A high-performing athlete can still have low energy availability.","Body weight can remain stable while physiology is impaired.","Confidentiality, documentation, referral pathways, and team communication matter."]},"13":{"takeaway":"The most valuable long-term nutrition plan is one a person can live with. Small improvements in activity, food quality, and weight trajectory can meaningfully reduce risk even without dramatic weight loss.","cases":[["The former athlete","A client still eats for a previous training load and is gradually gaining weight.","Respect the athlete identity, update energy needs, preserve satisfying meals, and rebuild enjoyable activity."],["The new type 2 diabetes diagnosis","A sedentary client feels overwhelmed and expects a restrictive “diabetes diet.”","Work within scope and alongside medical care to build regular activity, balanced meals, fibre, and realistic carbohydrate habits."],["The post-menopause bone-health goal","A client wants to protect bone and independence.","Coordinate adequate calcium, vitamin D, protein, and energy with progressive weight-bearing and resistance activity."]],"practice":["Health risk responds to behaviour even when the scale changes slowly.","Former athletes may need help adapting identity and routine, not just calories.","Chronic-disease nutrition works best with medical collaboration and sustainable goals."]}}};

UNITS[1]={n:1,title:"Introduction to Sports Nutrition",short:"Introduction",
blurb:"Training and nutrition, dietary standards, evidence, credentials, and professional boundaries.",
lede:"Connect an athlete’s training demands with nutrition, then learn how to judge the evidence behind a recommendation.",
objectives:["Explain why training and nutrition need an integrated plan.","Apply basic nutrition principles to athletes and distinguish long-term from short-term goals.","Evaluate supplement legality, ethics, purity, safety, and effectiveness.","Distinguish study designs, correlation, and causation.","Recognize credentials and professional boundaries."],
