<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports and Fitness Nutrition: Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F3F5EF;--card:#FFFFFF;--ink:#16241C;--muted:#55655B;--line:#D3DAD0;
  --brand:#1F4D3A;--on-brand:#FFFFFF;--link:#1F4D3A;--hero:#1F4D3A;--focus:#B8901A;
  --crp:#C48A0C;--gly:#B5472B;--oxy:#1D6F82;
  --crp-soft:#F7EDCF;--gly-soft:#F6DED5;--oxy-soft:#D6EAEF;
  --cho:#4F7CAC;--fat:#A2743B;
  --ok:#2E7D4F;--ok-bg:#DFF1E5;--bad:#B23A2E;--bad-bg:#F8DDD8;--soft:#EAEFE6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1914;--card:#16241D;--ink:#E7EEE8;--muted:#A3B3A9;--line:#2A3B32;
    --brand:#2E6B50;--on-brand:#FFFFFF;--link:#8FD3B0;--hero:#173427;--focus:#E3B23C;
    --crp:#E3B23C;--gly:#EE8A67;--oxy:#5CC0D6;
    --crp-soft:#3A2F10;--gly-soft:#3B2119;--oxy-soft:#12313A;
    --cho:#7FA8D6;--fat:#D2A26A;
    --ok:#7FD0A0;--ok-bg:#163A27;--bad:#F09A8E;--bad-bg:#421E19;--soft:#1B2C23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1914;--card:#16241D;--ink:#E7EEE8;--muted:#A3B3A9;--line:#2A3B32;
  --brand:#2E6B50;--on-brand:#FFFFFF;--link:#8FD3B0;--hero:#173427;--focus:#E3B23C;
  --crp:#E3B23C;--gly:#EE8A67;--oxy:#5CC0D6;
  --crp-soft:#3A2F10;--gly-soft:#3B2119;--oxy-soft:#12313A;
  --cho:#7FA8D6;--fat:#D2A26A;
  --ok:#7FD0A0;--ok-bg:#163A27;--bad:#F09A8E;--bad-bg:#421E19;--soft:#1B2C23;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 92px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.15;margin:0}
h2{font-size:clamp(1.65rem,3.4vw,2.15rem);margin:0 0 .25em;letter-spacing:-.01em}
h3{font-size:1.3rem;margin:1.6em 0 .5em}
h4{font-size:1.08rem;margin:0 0 .3em}
p{margin:.6em 0;max-width:68ch}
a{color:var(--link)}
sub,sup{line-height:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:26px 18px 30px 22px;border-right:1px solid var(--line);background:var(--paper)}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.bt{font:600 1.08rem/1.2 Fraunces,Georgia,serif}
.bs{color:var(--muted);font-size:.9rem;margin-top:2px}
.gauge{position:relative;width:56px;height:56px;flex:none}
.gauge svg{display:block}
.gbg{fill:none;stroke:var(--line);stroke-width:5}
.gfg{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;stroke-dasharray:138.23;stroke-dashoffset:138.23;transition:stroke-dashoffset .5s ease}
:root[data-theme="dark"] .gfg{stroke:#8FD3B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gfg{stroke:#8FD3B0}}
.gauge span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.82rem}
nav .nh{margin:18px 0 6px;color:var(--muted);font-size:.86rem;font-weight:600}
nav a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.98rem;line-height:1.3}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft);font-weight:600}
nav a i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
nav a.done i{background:var(--ok);border-color:var(--ok)}
nav a.plain{padding-left:26px}

main{padding:0 34px 90px;max-width:900px;width:100%;margin:0 auto}
.sec{padding-top:46px}
.src{color:var(--muted);font-size:.92rem;margin:0 0 .9em}

.hero{background:var(--hero);color:#EEF4EC;border-radius:16px;padding:34px 34px 26px;margin-top:26px}
.hero .cite{color:#B8CDBE;font-size:.95rem;margin:0}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.3rem);letter-spacing:-.015em;margin:.25em 0 .35em}
.hero .lede{max-width:58ch;font-size:1.1rem;color:#D8E5DB;margin:0}
.efforts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}
.chip{border:1px solid rgba(255,255,255,.4);background:transparent;color:#EEF4EC;padding:7px 13px;border-radius:999px;cursor:pointer;font-size:.95rem;line-height:1.25}
.chip small{opacity:.8;font-size:.82rem;margin-left:4px}
.chip[aria-pressed="true"]{background:#F2F6F0;color:#16241C;border-color:#F2F6F0;font-weight:600}
.hero :focus-visible{outline-color:#F0D27A}
.dim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dim{background:rgba(255,255,255,.08);border-radius:12px;padding:14px}
.dim .nm{font-weight:600;font-size:.98rem;line-height:1.25;min-height:2.5em}
.track{height:150px;border-radius:8px;background:rgba(0,0,0,.3);position:relative;overflow:hidden;margin:10px 0 8px}
.fill{position:absolute;left:0;right:0;bottom:0;height:var(--v,0%);border-radius:6px 6px 0 0;transition:height .55s ease,width .55s ease,box-shadow .55s ease}
.dim[data-k="0"] .fill{background:#E8B92F}
.dim[data-k="1"] .fill{background:#F08F6B}
.dim[data-k="2"] .fill{background:#67C6DB}
.dim .lv{font-size:.92rem;color:#D8E5DB}
.dim .lv b{color:#fff}
.heronote{margin:16px 0 0;max-width:64ch;color:#D8E5DB;font-size:1rem;min-height:3.2em}
.fine{color:#B8CDBE;font-size:.86rem;margin:10px 0 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
.callout{background:var(--soft);border-radius:12px;padding:14px 18px;margin:18px 0}
.callout p{margin:.3em 0}
.callout b.k{font-family:Fraunces,Georgia,serif}
.btn{background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:.96rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn[disabled]{opacity:.45;cursor:default}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--ink);white-space:nowrap}
.tag.crp{background:var(--crp-soft)}.tag.gly{background:var(--gly-soft)}.tag.oxy{background:var(--oxy-soft)}

table{border-collapse:collapse;width:100%;font-size:.97rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.9rem}
.tw{overflow-x:auto;margin:14px 0}
.tw table{min-width:520px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.eq{font:500 1.35rem/1.4 Fraunces,Georgia,serif;margin:.2em 0 .4em}
.small{font-size:.95rem;color:var(--muted)}

.stepper .dots{display:flex;gap:8px;margin-bottom:12px}
.dot{width:26px;height:8px;border-radius:99px;border:0;background:var(--line);cursor:pointer;padding:0}
.dot.on{background:var(--brand)}
:root[data-theme="dark"] .dot.on{background:#8FD3B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot.on{background:#8FD3B0}}
.sbody{min-height:118px}
.sbody .where{display:inline-block;font-size:.85rem;font-weight:600;background:var(--soft);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.snav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.scount{color:var(--muted);font-size:.9rem}
.tally{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:.95rem}
.tally .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--oxy);transition:width .4s ease}
.tally strong{font:600 1.3rem Fraunces,Georgia,serif;min-width:5.5ch;text-align:right}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
.fc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;min-height:88px;text-align:left;cursor:pointer;display:block;width:100%}
.fc:hover{border-color:var(--muted)}
.fc .a{display:none;font-weight:600}
.fc[aria-pressed="true"]{background:var(--crp-soft);border-color:transparent}
.fc[aria-pressed="true"] .q{display:none}
.fc[aria-pressed="true"] .a{display:block}
.fc .h{display:block;color:var(--muted);font-size:.84rem;margin-top:6px}
.fc[aria-pressed="true"] .h{display:none}

details{border-top:1px solid var(--line);padding:10px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1;color:var(--muted)}
details[open] summary::after{content:"\2212"}
details>div{padding-top:6px}

.chart{margin:14px 0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12.5px "Source Sans 3",system-ui,sans-serif}
.chart .lab{fill:var(--ink);font-weight:600}
.chart .ax{stroke:var(--muted);stroke-width:1}
.chart .gr{stroke:var(--line);stroke-width:1}
.cap{color:var(--muted);font-size:.9rem;margin:.2em 0 0}

.qc .qq{font-weight:600;margin:0 0 10px;max-width:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin:10px 0 0;font-size:.98rem;max-width:none}
.fb:empty{display:none}
.qc .lbl{color:var(--muted);font-size:.86rem;margin:0 0 6px}

.rer label{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-weight:600;margin:0 0 12px}
.rer input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--brand)}
.rer output{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.rerval{font:600 2.2rem/1 Fraunces,Georgia,serif;margin:6px 0 12px}
.rerval span{font:400 1rem "Source Sans 3",sans-serif;color:var(--muted);margin-left:8px}
.mix{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--line)}
.mix i{display:block;height:100%;transition:width .3s ease}
.mix .c{background:var(--cho)}.mix .f{background:var(--fat)}
.mixlg{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 0;font-size:.97rem}
.mixlg b{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

.tissues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tissue{background:var(--soft);border-radius:10px;padding:10px 14px}
.tissue h4{font-family:"Source Sans 3",sans-serif;font-size:.95rem;margin:0 0 3px}
.tissue p{margin:0;font-size:.95rem;max-width:none}

.glc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.glc div{background:var(--soft);border-radius:10px;padding:10px 12px}
.glc strong{display:block;font:600 1.7rem Fraunces,Georgia,serif}
.glc span{font-size:.92rem;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.96rem}
.facts b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.05rem;margin-bottom:2px}

.rv .scn{font-weight:600;margin:0 0 10px;max-width:none}
.rv .ans{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rv .ans p{max-width:none}

.ev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.ev .card{margin:0}
.ev .st{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ev .st i{width:11px;height:11px;border-radius:50%;display:inline-block}
.ev .g i{background:var(--ok)}.ev .y i{background:var(--crp)}
.ev p{margin:.3em 0;font-size:.96rem;max-width:none}

.cl{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.cl input{margin-top:.35em;width:18px;height:18px;accent-color:var(--brand);flex:none}
.cl input:checked+span{color:var(--muted);text-decoration:line-through}

.deck{text-align:center}
.deck .fc{min-height:190px;display:grid;place-items:center;text-align:center;font-size:1.15rem}
.deck .fc[aria-pressed="true"]{background:var(--oxy-soft)}
.deck .row{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.deck .meta{color:var(--muted);font-size:.92rem;margin:0 0 10px;max-width:none}

.qz .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.qz .top{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem;margin-bottom:8px}
.qz .qq{font:500 1.2rem/1.35 Fraunces,Georgia,serif;margin:0 0 12px;max-width:none}
.score{font:600 2.4rem/1 Fraunces,Georgia,serif;margin:.2em 0}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss p{margin:.2em 0;max-width:none}

footer{margin-top:60px;color:var(--muted);font-size:.9rem}

@media (max-width:860px){
  .shell{display:block}
  aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;overflow:visible;padding:10px 16px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .brandrow{margin-bottom:6px}
  .gauge{width:44px;height:44px}.gauge svg{width:44px;height:44px}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  nav .nh{display:none}
  nav a,nav a.plain{white-space:nowrap;padding:5px 10px;font-size:.92rem;border:1px solid var(--line);border-radius:999px}
  nav a i{display:none}
  nav a.done{border-color:var(--ok)}
  main{padding:0 16px 70px}
  .hero{padding:24px 18px 20px}
  .sec{padding-top:34px}
  .tissues,.ev{grid-template-columns:1fr}
  .dim{padding:10px}
  .track{height:120px}
  .glc{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:600px){
  .dim-grid{grid-template-columns:1fr}
  .dim{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px}
  .dim .nm{min-height:0;grid-row:1;grid-column:1}
  .dim .lv{grid-row:1;grid-column:2}
  .track{grid-row:2;grid-column:1/-1;height:14px;margin:0}
  .fill{top:0;bottom:0;right:auto;height:100%;width:var(--v,0%);border-radius:6px}
  .chip small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== hub additions ===== */
nav .ul{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px}
nav .ul b{font:600 .82rem "Source Sans 3",sans-serif;color:var(--muted);border:1.5px solid var(--line);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
nav .ul em{font-style:normal;font-size:.8rem;color:var(--muted)}
nav .ul.on b{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
nav .ul.done b{border-color:var(--ok);color:var(--ok)}
nav .ul.on.done b{color:var(--on-brand)}
nav .sub{margin:2px 0 8px 18px;padding-left:12px;border-left:2px solid var(--line)}
nav .sub a{padding:4px 6px;font-size:.92rem}
nav .sub a i{width:8px;height:8px}
nav .home{font-weight:600}
.hero .chips2{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
.hero .chips2 a{color:#EEF4EC;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 13px;text-decoration:none;font-size:.93rem;line-height:1.25}
.hero .chips2 a:hover{background:rgba(255,255,255,.12)}
.hero .chips2 a.done{background:#F2F6F0;color:#16241C;border-color:#F2F6F0;font-weight:600}
.hero .stats{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 0}
.hero .stats div{font-size:.95rem;color:#D8E5DB}
.hero .stats strong{display:block;font:600 1.9rem/1 Fraunces,Georgia,serif;color:#fff}
.hero .btn{background:#F2F6F0;color:#16241C;border-color:#F2F6F0;margin-top:18px}
.hero h1 .n{display:block;font:500 1rem "Source Sans 3",sans-serif;color:#B8CDBE;letter-spacing:0;margin-bottom:4px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:22px 0}
.ucard{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);min-height:180px}
.ucard:hover{border-color:var(--muted)}
.ucard .no{font-size:.86rem;color:var(--muted);font-weight:600}
.ucard h3{margin:0;font-size:1.2rem}
.ucard p{margin:0;font-size:.94rem;color:var(--muted);flex:1}
.ucard .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.ucard .bar i{display:block;height:100%;background:var(--brand)}
:root[data-theme="dark"] .ucard .bar i{background:#8FD3B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ucard .bar i{background:#8FD3B0}}
.ucard .meta{font-size:.86rem;color:var(--muted)}
.notes .nt{margin:0 0 4px}
.notes h3{margin:1.1em 0 .25em;font-size:1.12rem}
.notes p{margin:.2em 0 .5em}
.calc .cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin-bottom:8px}
.calc label{display:grid;gap:4px;font-weight:600;font-size:.95rem;margin:0}
.calc input[type=number],.calc select{font:inherit;font-weight:400;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.calc .co{margin-top:10px;padding:12px 16px;background:var(--soft);border-radius:10px;min-height:3em}
.calc .co p{margin:.25em 0;max-width:none}
.calc .co b{font-family:Fraunces,Georgia,serif}
.calc h4{margin:0 0 10px}
.sortrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sortrow:first-of-type{border-top:0}
.sortrow .st{flex:1 1 240px}
.sortrow .cb{display:flex;gap:6px;flex-wrap:wrap}
.sortrow .cb button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.92rem;cursor:pointer}
.sortrow .cb button:hover:not([disabled]){border-color:var(--muted)}
.sortrow .cb button.right{background:var(--ok-bg);border-color:var(--ok)}

<script>
const DATA={"quiz":{"1":[{"q":"Which of the following is the best definition of exercise physiology?","o":["Art and science of training","Laboratory study of mental and physical fatigue","Scientific study of the body’s responses and adaptations to movement","Clinical observations of acute and chronic exercise"],"a":2,"e":"Exercise physiology studies the body’s responses and adaptations to movement."},{"q":"Which of the following is the best definition of sports nutrition?","o":["Ingestion, digestion, absorption, metabolism, and biochemistry of nutrients","Energy needed to train and perform","Science of eating and supplementation","Application of nutritional and physiological principles that support training and performance"],"a":3,"e":"Sports nutrition applies nutrition and physiology to training and performance."},{"q":"The term endurance athlete is generally interpreted to mean that the athlete:","o":["predominantly uses the oxygen-dependent energy system.","trains for many hours","only engages in moderate-intensity activity","does not lift weights as part of training."],"a":0,"e":"Endurance emphasizes oxygen-dependent energy production."},{"q":"The term macronutrients typically refers to:","o":["any nutrient that provides energy","the eight key nutrients needed for good health.","carbohydrates, proteins, and fats.","vitamins and minerals."],"a":2,"e":"The conventional macronutrient grouping here is carbohydrate, protein, and fat."},{"q":"The nutrition goals of each mesocycle are:","o":["always the same to ensure consistency.","a reflection of the intensity and volume of activity.","unplanned and very flexible.","based on each athlete’s aerobic capacity."],"a":1,"e":"Each phase’s intensity and volume inform its nutrition goals."},{"q":"Which of the following best describes the term Dietary Reference Intakes (DRI)?","o":["Minimum amount of nutrients needed by an individual each day","Maximum amount of nutrients that should not be exceeded each day","Current nutrient standard for individuals","Eight key nutrients needed for good health"],"a":2,"e":"DRI is the umbrella nutrient reference standard."},{"q":"The Tolerable Upper Intake Level (UL) helps people to answer which of the following questions regarding vitamins and \nminerals?","o":["Am I deficient?","Am I consuming enough?","Am I taking in too much?","Do I have the right balance between food and supplements?"],"a":2,"e":"UL addresses excessive intake, not an adequacy target."},{"q":"Which of the following best describes the application of the Dietary Reference Intakes (DRI) to trained athletes?","o":["The DRI are not applicable to athletes because they were developed for the general population.","Although they were developed for the general population, athletes can use the DRI to assess the adequacy of their diets.","Athletes should add 10% to DRI values to reflect the increased need for nutrients by trained athletes.","All of the DRI are applicable to both the general and athletic populations."],"a":1,"e":"Athletes can use the general standards as a foundation; no blanket percentage increase is prescribed."},{"q":"What does it mean when an active ingredient in a dietary supplement or over-the-counter medication is standardized?","o":["Strict quality control measures have been followed","Amount consumed needs to be adjusted based on body weight","The same amount is found in each pill or tablet","Only natural extracts are used"],"a":2,"e":"Standardized means a consistent active-ingredient amount, not guaranteed safety or purity."},{"q":"The weakest of all scientific findings are from which of the following types of studies?","o":["Case studies","Epidemiological studies","Correlational studies","Experimental studies"],"a":0,"e":"Case studies are the weakest listed basis for general recommendations."},{"q":"The term level of evidence refers to:","o":["the number of peers who reviewed a research study manuscript.","the number of epidemiological studies conducted on a topic.","the strength of the study with the largest number of subjects.","the relative strength of the collective body of research on a topic."],"a":3,"e":"Evidence strength reflects the collective research, not one study."},{"q":"Extrapolating research results is not recommended because:","o":["only the original population was directly tested.","causation is reduced to correlation.","consensus has not been reached.","it is a Grade I (Level A) conclusion."],"a":0,"e":"Only the original population was directly tested."},{"q":"Much health-related information on the Internet is:","o":["inaccurate","unreliable","scientific based and peer reviewed","A & B are correct"],"a":3,"e":"The chapter warns that online information can be inaccurate and unreliable."},{"q":"Sports nutrition is the integration of scientifically based nutrition and exercise physiology principles developed to support good \nhealth, training, performance, and recovery.","o":["True","False"],"a":0,"e":"This matches the chapter’s integrated definition."},{"q":"Strength athlete is a term that is used to describe an athlete that primarily depends on anaerobic energy systems.","o":["True","False"],"a":0,"e":"Strength efforts have an anaerobic emphasis."},{"q":"Nutrition periodization is the development of an eating plan over a short period of time (i.e. 1-10 days).","o":["True","False"],"a":1,"e":"Periodization aligns nutrition with training phases; short meal planning alone does not define it."},{"q":"Athletes should follow a rigid diet plan because this is the best way to ensure that both the art and science of nutrition are met.","o":["True","False"],"a":1,"e":"Individual application requires flexibility rather than a rigid diet."},{"q":"The Dietary Reference Intakes (DRI) and Recommended Dietary Allowances (RDA) are essentially the same and these terms can \nbe used interchangeably.","o":["True","False"],"a":1,"e":"RDA is one of the DRI reference values."},{"q":"When conducting research, subject selection should be randomized and peer review processes should be blind.","o":["True","False"],"a":null,"e":"Not scored: subject selection, random assignment, and blinded peer review are distinct processes. The slides do not establish this combined statement as universally true or false."},{"q":"Research studies should be replicated to validate the results.","o":["True","False"],"a":0,"e":"Replication tests reproducibility."},{"q":"Anecdotal evidence refers to data obtained from research studies with less than 10 subjects.","o":["True","False"],"a":1,"e":"Anecdotal evidence is personal accounts, not a sample-size category."},{"q":"A rich body of scientific data is a term used to describe information derived from well-designed, high-quality research studies \nwith many subjects.","o":["True","False"],"a":0,"e":"Suggested course interpretation: a rich evidence base includes high-quality, well-designed studies with substantial participant evidence. Size alone does not establish quality."},{"q":"Evidence-based sports nutrition recommendations are based primarily on observing the dietary intakes of successful athletes in \na given sport.","o":["True","False"],"a":1,"e":"Recommendations rely on cumulative scientific evidence, not primarily successful athletes’ habits."},{"q":"The strength of any scientific recommendation depends on the quality of the research conducted.","o":["True","False"],"a":0,"e":"Research quality affects confidence in recommendations."},{"q":"A scope of practice helps define professional boundaries.","o":["True","False"],"a":0,"e":"Scope of practice defines professional boundaries."},{"q":"Many consumers find nutrition and exercise information on the Internet and studies have shown that this information increases \nknowledge and results in a positive change in health status.","o":["True","False"],"a":1,"e":"Suggested course interpretation: access to online information alone does not establish improved health; the chapter highlights unreliable information."},{"q":"Scope-of-practice definitions help identify professional boundaries and protect consumers from inappropriately trained \npractitioners.","o":["True","False"],"a":0,"e":"Professional boundaries help protect clients."}],"2":[{"q":"The best definition of bioenergetics is:","o":["the study of metabolism.","the physiological processes associated with exercise.","the process of converting food into biological energy.","the transformation of energy to heat."],"a":2,"e":"Bioenergetics converts food into biologically useful energy."},{"q":"The best definition of energy is the:","o":["absence of physical or mental fatigue.","ability to perform work.","generation of tension by contracting muscle.","thermic effect of movement."],"a":1,"e":"Energy is the ability to perform work."},{"q":"Which of the following is true regarding the First Law of Thermodynamics?","o":["Energy is not created or destroyed.","Energy is created but not destroyed.","Energy is destroyed but not created.","Energy is both created and destroyed."],"a":0,"e":"The first law states that energy is neither created nor destroyed, only transformed."},{"q":"Kinetic energy refers to:","o":["energy that is stored to be used later.","energy used for skeletal muscle contraction.","the release of stored energy to perform work.","all of the above"],"a":2,"e":"Kinetic energy is released from storage to perform work."},{"q":"ATP is an example of:","o":["chemical energy.","electrical energy.","mechanical energy.","thermal energy."],"a":0,"e":"ATP stores chemical energy."},{"q":"Which of the following is a type of chemical reaction that results in energy being absorbed or stored?","o":["Endergonic","Exergonic","Enderthermic","Excitation"],"a":0,"e":"Endergonic reactions require and store energy."},{"q":"Which of the following is a type of chemical reaction that results in energy being released?","o":["Endergonic","Exergonic","Enderthermic","Excitation"],"a":1,"e":"Exergonic reactions release energy."},{"q":"Which of the following is an endergonic reaction?","o":["The releasing (triggering) of a mouse trap","The release of water from behind a dam","The breakdown of ATP to ADP","The rephosphorylation of ADP"],"a":3,"e":"Rephosphorylating ADP requires an energy input."},{"q":"The two most common factors that influence enzyme activity are:","o":["time and temperature.","temperature and pH.","pH and oxygen availability.","oxygen availability and time."],"a":1,"e":"Temperature and pH commonly affect enzyme activity."},{"q":"Under the most demanding conditions (e.g., very high-intensity exercise), ATP concentrations in skeletal muscles are not likely to drop more than:","o":["5-10%.","10-20%.","20-30%.","40-50%."],"a":2,"e":"The course describes ATP concentration as unlikely to fall by more than 20–30%."},{"q":"If a food contains 350 Calories, how many kilocalories does it contain?","o":["148","350","1,480","3,250"],"a":1,"e":"A food Calorie is one kilocalorie."},{"q":"The International System of Units (SI units) unit for energy is the:","o":["calorie (lowercase c).","Calorie (uppercase c).","kilocalorie.","joule."],"a":3,"e":"The SI unit of energy is the joule."},{"q":"6,300 kJ is equivalent to how many kilocalories?","o":["812","1,500","2,625","6,300"],"a":1,"e":"6,300 ÷ 4.184 is about 1,506 kcal, closest to 1,500."},{"q":"On a kcal/g basis, the caloric content of carbohydrate is approximately the same as that of:","o":["alcohol.","fat.","protein.","a and c"],"a":2,"e":"The chapter’s human-calorimeter values list carbohydrate and protein at about 4.2 kcal/g."},{"q":"On average, 1 liter of oxygen consumed is equivalent to _____ kcal of energy expended.","o":["1","3","5","7"],"a":2,"e":"The chapter uses about 5 kcal per litre of oxygen."},{"q":"Which of the following macronutrients has the greatest influence on the thermic effect of food?","o":["Carbohydrate","Protein","Fat"],"a":1,"e":"Protein produces the greatest thermic effect of the macronutrients."},{"q":"The “energy out” factor that that can be increased to the greatest degree is:","o":["resting metabolism.","thermic effect of food.","physical activity."],"a":2,"e":"Physical activity is the most variable and most readily increased component."},{"q":"One MET is equal to:","o":["energy expenditure at rest.","energy expenditure during the first 10 minutes of exercise.","energy expenditure prior to the point of fatigue.","55 kcal/hour."],"a":0,"e":"One MET represents resting energy expenditure."},{"q":"To maintain energy balance, it is estimated that a sedentary individual requires approximately _____ kcal/kg of body weight daily.","o":["20","25","30","35"],"a":2,"e":"The chapter’s sedentary estimate begins around 30 kcal/kg/day."},{"q":"If an athlete’s estimated energy need is above 50 kcal/kg of body weight daily, then this athlete is likely engaging in activity described as:","o":["normal.","moderate.","heavy.","exceptional."],"a":3,"e":"Above 50 kcal/kg/day corresponds to exceptional activity in the table."},{"q":"The terms calorie and Calorie can be used interchangeably in scientific writing.","o":["True","False"],"a":1,"e":"Lowercase calorie and food Calorie differ by a factor of 1,000 in scientific writing."},{"q":"The law of Conservation of Energy states that energy is neither created nor destroyed but that it can be transformed.","o":["True","False"],"a":0,"e":"This restates conservation of energy."},{"q":"One liter (1 L) of oxygen is equal to 9 kcal/g.","o":["True","False"],"a":1,"e":"One litre of oxygen is approximately 5 kcal, not 9 kcal/g."},{"q":"When compared to machines, humans are relatively efficient at converting energy.","o":["True","False"],"a":1,"e":"The cycling example shows only about 23% efficiency."},{"q":"Reactions in which energy is released are referred to as endergonic reactions.","o":["True","False"],"a":1,"e":"Energy-releasing reactions are exergonic."},{"q":"ATP is critical for muscle contraction, but is not involved in muscle relaxation.","o":["True","False"],"a":1,"e":"ATP also supports detachment, ion pumping, and relaxation."},{"q":"In the excitation-contraction process of generating tension or force in skeletal muscle, ATP is needed only for the \"power stroke\" part of the process.","o":["True","False"],"a":1,"e":"ATP is required at more than the power-stroke moment."},{"q":"ATP is the known as the energy currency because it is the primary source of energy in the body.","o":["True","False"],"a":0,"e":"The course identifies ATP as the body’s immediate energy currency."},{"q":"ATP is the direct source of energy for the body to perform work. The energy contained in food must be biochemically transformed to ATP.","o":["True","False"],"a":0,"e":"Food energy must be transformed into ATP before work occurs."},{"q":"The majority of ATP stored in skeletal muscle cannot be used for force production, even during very high intensity exercise.","o":["True","False"],"a":1,"e":"Stored ATP can support force production, although the supply is small and continually resynthesized."}],"3":[{"q":"What is creatine?","o":["An amino acid","A nitrogen-containing compound made from amino acids","A phosphate-containing protein","A byproduct of the breakdown of creatinine"],"a":1,"e":"Creatine is a nitrogen-containing compound synthesized from amino acids."},{"q":"Based on dietary intake only, whom would you expect to have the lowest amount of muscle creatine?","o":["Vegetarians","Red meat eaters","Fish eaters","No differences would be expected based on dietary intake"],"a":0,"e":"Meat and fish provide dietary creatine, so vegetarians generally start with lower muscle creatine stores."},{"q":"Which of the following is a true statement regarding creatine supplementation?","o":["Has been shown to be beneficial for both strength and endurance athletes","Has a direct effect on improving strength, speed, and power for strength athletes","Causes dehydration and muscle cramping in strength athletes","Allows strength and power athletes to sustain high-intensity training"],"a":3,"e":"Creatine can help sustain repeated high-intensity training; it does not directly guarantee greater maximal power."},{"q":"In a well-designed study, a statistically significant increase in maximal strength with creatine supplementation was detected at 12 weeks but not at 1 week. What is the likely explanation?","o":["Creatine supplementation allowed athletes to complete more weight lifting repetitions and sets, but the effects of the training are not seen immediately.","It takes time (about three months) for the body to increase the total amount of ATP stored in muscle.","Time was needed to maximize carbohydrate stores because creatine storage and function are directly related to the size of muscle glycogen stores.","Hormonal balance is altered, but the changes are slow and subtle and not detectable for approximately 12 weeks."],"a":0,"e":"The supplement can support more training work, while strength adaptation takes time."},{"q":"Anaerobic glycolysis is an energy system that uses:","o":["carbohydrate only.","carbohydrate preferentially, but fat or protein if necessary.","carbohydrate, protein, or fat based on availability.","carbohydrate, protein, fat, or alcohol."],"a":0,"e":"Anaerobic glycolysis uses carbohydrate only."},{"q":"The rate of glycolysis in muscle is controlled primarily by:","o":["lactate dehydrogenase (LDH).","myosin ATPase.","creatine kinase (CK).","phosphofructokinase (PFK)."],"a":3,"e":"PFK is the main rate-limiting enzyme identified for glycolysis."},{"q":"The net (final) ATP production from anaerobic glycolysis is:","o":["2 ATPs if beginning with glycogen.","3 ATPs if beginning with glucose.","3 ATPs if beginning with glycogen.","38 ATPs if beginning with glucose."],"a":2,"e":"Starting from glycogen yields a net three ATP in the chapter."},{"q":"If creatine phosphate is nearly depleted in skeletal muscle by high-intensity exercise, approximately how long does it take to restore creatine phosphate levels?","o":["1 – 2 seconds","1 – 2 minutes","1 – 2 hours","1 – 2 days"],"a":1,"e":"The course gives about 1–2 minutes for substantial creatine phosphate restoration."},{"q":"The energy source preferred by exercising muscle for the process of anaerobic glycolysis is:","o":["glucose.","glycogen.","glycerol.","creatine."],"a":1,"e":"Muscle glycogen avoids the first ATP cost and is preferred during anaerobic glycolysis."},{"q":"The primary function of the Krebs cycle is to:","o":["degrade glucose or glycogen to lactate and produce ATP.","oxidize carbohydrates, fats, and proteins and ready them for ATP production.","generate large amounts of ATP and related compounds.","produce carbon dioxide and water for use in other energy-yielding systems."],"a":1,"e":"The Krebs cycle oxidizes fuel intermediates and transfers electrons for later ATP production."},{"q":"The rate-limiting enzyme associated with the Krebs cycle is:","o":["lactate dehydrogenase (LDH).","creatine kinase (CK).","phosphofructokinase (PFK).","isocitrate dehydrogenase (IDH)."],"a":3,"e":"IDH is the rate-limiting enzyme associated with the Krebs cycle in the chapter."},{"q":"It is biochemically impossible to convert carbohydrate to fatty acids.","o":["True","False"],"a":1,"e":"Excess carbohydrate can be converted to fatty acids."},{"q":"As exercise intensity increases, the percentage of energy from carbohydrate metabolism decreases.","o":["True","False"],"a":1,"e":"Carbohydrate contribution rises as exercise intensity increases."},{"q":"At rest, the preferred fuel source is carbohydrate.","o":["True","False"],"a":1,"e":"At rest, fat generally supplies the greater share of energy."},{"q":"Anaerobic glycolysis is a process that begins with glucose and ends with lactate.","o":["True","False"],"a":0,"e":"In the course model, anaerobic glycolysis converts glucose or glycogen through pyruvate toward lactate."},{"q":"Once pyruvate is converted to lactate in the muscle it cannot be converted back.","o":["True","False"],"a":1,"e":"The pyruvate–lactate reaction is reversible."},{"q":"Most research has shown that short-term creatine “loading” results in an immediate increase in absolute, maximal power.","o":["True","False"],"a":1,"e":"Research more often supports maintaining repeated power rather than an immediate rise in absolute maximal power."},{"q":"Creatine supplements are effective for both strength and endurance athletes.","o":["True","False"],"a":1,"e":"Creatine is most relevant to repeated high-intensity strength and power work, not endurance performance in general."},{"q":"An all-out sprint lasting 10 seconds would depend primarily on anaerobic glycolysis as a source of ATP.","o":["True","False"],"a":1,"e":"A 10-second maximal effort depends strongly on the faster creatine phosphate system, while all systems contribute."},{"q":"The purpose of the three energy systems is to use chemical energy to re-form ATP.","o":["True","False"],"a":0,"e":"All three systems provide chemical energy to re-form ATP."},{"q":"ATP and CrP are both high-energy phosphate compounds.","o":["True","False"],"a":0,"e":"ATP and creatine phosphate both contain high-energy phosphate bonds."},{"q":"Most research has shown that creatine supplementation results in the maintenance of exercise power output rather than an immediate increase in absolute, maximal power.","o":["True","False"],"a":0,"e":"This matches the research interpretation emphasized in the course."},{"q":"Highly aerobic muscle fibers and other tissues can use lactate as an energy source.","o":["True","False"],"a":0,"e":"Aerobic tissues can convert lactate to pyruvate and oxidize it."},{"q":"The respiratory exchange ratio (RER) uses the amount of carbon dioxide produced and the amount of oxygen consumed to determine the percentage of energy derived from carbohydrate and fat.","o":["True","False"],"a":0,"e":"RER uses VCO₂ divided by VO₂ to estimate carbohydrate and fat oxidation."},{"q":"The energy system that has the fastest rate of ATP replenishment is anaerobic glycolysis.","o":["True","False"],"a":1,"e":"Creatine phosphate replenishes ATP faster than anaerobic glycolysis."},{"q":"Those who eat beef or fish consume about 5 g of creatine daily.","o":["True","False"],"a":1,"e":"Typical dietary creatine from meat or fish is well below 5 g/day in the course context."},{"q":"The terms Krebs cycle and the tricarboxylic acid (TCA) cycle are interchangeable.","o":["True","False"],"a":0,"e":"Krebs, citric acid, and TCA cycle refer to the same pathway."},{"q":"The major function of the Krebs cycle portion of oxidative phosphorylation is to produce moderate to large amounts of ATP.","o":["True","False"],"a":1,"e":"Its primary role is removing electrons for the electron transport chain, not directly producing large amounts of ATP."},{"q":"The branched chain amino acids can be relatively easily metabolized by skeletal muscle but they are considered the least preferred fuel source when compared to carbohydrates and fats.","o":["True","False"],"a":0,"e":"BCAAs can be oxidized by muscle but remain a less preferred fuel than carbohydrate or fat."},{"q":"An exceptionally well-trained male endurance athlete will likely have a VO2 max greater than 100 ml/kg/min.","o":["True","False"],"a":1,"e":"Values above 100 ml/kg/min are beyond the likely range stated for exceptionally trained male endurance athletes."}],"4":[{"q":"Complex carbohydrate is a:","o":["monosaccharide.","disaccharide.","polysaccharide."],"a":2,"e":"Complex carbohydrates are polysaccharides made from many linked sugar units."},{"q":"Fructose is a:","o":["monosaccharide.","disaccharide.","polysaccharide."],"a":0,"e":"Fructose is one of the three dietary monosaccharides."},{"q":"Muscle glycogen is a:","o":["monosaccharide.","disaccharide.","polysaccharide."],"a":2,"e":"Glycogen is a branched polysaccharide used to store glucose."},{"q":"Lactose is a:","o":["monosaccharide","disaccharide made up of 2 glucose molecules","disaccharide made up of galactose and glycogen","none of the above"],"a":3,"e":"Lactose is a disaccharide made from glucose and galactose, which none of the first three options states."},{"q":"What is the primary benefit to consuming a high-carbohydrate meal 3 hours prior to competition?","o":["Enhanced liver glycogen","Enhanced muscle glycogen","Enhanced fat oxidation","Enhanced fat mobilization"],"a":0,"e":"A pre-event carbohydrate meal helps restore liver glycogen and supports blood glucose availability."},{"q":"As a “rule of thumb,” which of the following best describes pre-event carbohydrate recommendations?","o":["100 g 2 hours prior","1 g/kg 1 hour prior, 2 g/kg 2 hours prior, 3 g/kg 3 hours prior","50% of the athlete’s usual carbohydrate intake","No “rule of thumb” as pre-event carbohydrate intake must be calculated precisely"],"a":1,"e":"The course presents the 1 g/kg per hour-before-exercise rule as a practical starting point."},{"q":"Glucose is a:","o":["monosaccharide.","disaccharide.","polysaccharide."],"a":0,"e":"Glucose is a single sugar unit and therefore a monosaccharide."},{"q":"Fiber is a:","o":["monosaccharide.","disaccharide.","polysaccharide."],"a":2,"e":"Dietary fibre consists largely of plant polysaccharides."},{"q":"What is the composition of sucrose?","o":["Two fructose units","One glucose and one fructose unit","One glucose and one galactose unit","One galactose and one fructose unit"],"a":1,"e":"Sucrose contains one glucose and one fructose."},{"q":"What is the composition of lactose?","o":["Two fructose units","One glucose and one fructose unit","One glucose and one galactose unit","One galactose and one fructose unit"],"a":2,"e":"Lactose contains one glucose and one galactose."},{"q":"_____ is an example of a sugar alcohol.","o":["Cellulose","Maltose","Guar gum","Glycerol"],"a":3,"e":"Glycerol is an alcohol derived from sugar chemistry."},{"q":"Why is the caloric value of some sugar alcohols less than 4 kcal/g?","o":["They are not completely absorbed","They are not completely metabolized by cells for energy","They cannot be transported into the mitochondria","All of the above"],"a":0,"e":"Some sugar alcohols provide less energy because the intestine does not completely absorb them."},{"q":"What is the intended meaning of the marketing term “low-impact carbs”?","o":["Carbohydrate foods that are burned for energy rather than stored as fat.","Carbohydrate foods with fewer kilocalories than similar products.","Carbohydrate foods that result in a slow rise in blood glucose and insulin.","Carbohydrate foods that contain both simple and complex carbohydrates."],"a":2,"e":"The term is intended to suggest a slower rise in blood glucose and insulin."},{"q":"What is an end product of carbohydrate digestion?","o":["Sucrose","Glucose","Lactose","Maltose"],"a":1,"e":"Digestible carbohydrate must be reduced to monosaccharides such as glucose for absorption."},{"q":"Why are many people unable to digest milk sugar?","o":["They lack pancreatic amylase","They lack the proper intestinal bacteria","They were not breast-fed","They have a lactase deficiency"],"a":3,"e":"Lactase splits lactose; insufficient lactase causes lactose malabsorption."},{"q":"Why does fructose not appear in circulating blood after absorption?","o":["It is used immediately by the intestinal cells for energy","It is transported via the lymphatic system and taken up by cells immediately","It is immediately trapped by the liver and converted to glucose","All of the above"],"a":2,"e":"Absorbed fructose travels to the liver, where it is taken up and converted."},{"q":"How do fructose and glucose absorption and uptake differ?","o":["The carrier is the same but absorption is slower when loaded with fructose.","Glucose appears in the blood rapidly but fructose appears in the blood slowly.","Fructose absorption depends on a concentration gradient while glucose absorption requires active transport.","There are no differences between fructose and glucose absorption."],"a":2,"e":"Fructose uses facilitated transport down a gradient; glucose uses sodium-dependent active transport."},{"q":"Of the following, the only characteristic shared by sugars and starches is their:","o":["kilocalories per gram.","rate of appearance in the blood.","nutrient content.","sweetness level."],"a":0,"e":"Digestible sugars and starches both provide about 4 kcal per gram."},{"q":"Blood glucose of 80 mg/dl is considered:","o":["hypoglycemia.","hyperglycemia.","within the normal range."],"a":2,"e":"80 mg/dL falls within the normal fasting range."},{"q":"Under normal circumstances, _____ is used to restore fallen blood glucose levels.","o":["muscle glycogen","liver glycogen","glucose provided by the oxidation of fat","glucose provided by the oxidation of muscle protein"],"a":1,"e":"The liver can break down its glycogen and release glucose into circulation."},{"q":"The physiological response to hyperglycemia resulting from the consumption of carbohydrate-containing foods is:","o":["stimulation of alpha cells in the pancreas and secretion of insulin.","stimulation of beta cells in the pancreas and the secretion of insulin.","stimulation of alpha cells in the pancreas and secretion of glucagon.","stimulation of beta cells in the pancreas and secretion of glucagon."],"a":1,"e":"High blood glucose stimulates pancreatic beta cells to secrete insulin."},{"q":"The release of insulin results in the:","o":["uptake of glucose into cells.","uptake of amino acids into muscle cells.","storage of glucose as glycogen in liver and muscle.","all of the above"],"a":3,"e":"Insulin supports glucose uptake, amino-acid uptake, and glycogen storage."},{"q":"What hormone is responsible for stimulating the breakdown of liver glycogen and its release as glucose?","o":["Glucagon","Insulin","Thyroid-stimulating hormone","Pancreatic lipase"],"a":0,"e":"Glucagon raises blood glucose by stimulating liver glycogen breakdown."},{"q":"What does the glycemic index (GI) measure?","o":["Degree of sweetness","Potential for oxidation as a fue
